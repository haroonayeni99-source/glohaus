name: Verify calendar subscriptions
on:
  push:
    branches: [fix/calendar-readiness]
  pull_request:
    paths:
      - src/modules/business-tools/**
      - tests/calendar-*.test.ts
      - .github/workflows/calendar-subscriptions.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calendar-subscription-network:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify private-feed transport and isolated sync with the public GOV.UK calendar
        run: pnpm exec vitest run tests/calendar-feed-transport.test.ts tests/calendar-sync-database.test.ts --maxWorkers=2
        env:
          GLOHAUS_PUBLIC_FEED_SMOKE: "1"
