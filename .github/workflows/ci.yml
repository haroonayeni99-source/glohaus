name: Verify foundation
on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seller-native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-fixture
          POSTGRES_DB: glohaus_seller_validation
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glohaus_seller_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify full migrations, seller isolation and concurrent pause/cart locking on PostgreSQL
        run: pnpm exec vitest run tests/seller-hub.test.ts --maxWorkers=1
        env:
          GLOHAUS_NATIVE_DATABASE: "1"

  payout-native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-fixture
          POSTGRES_DB: glohaus_seller_validation
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glohaus_seller_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify withdrawal request isolation, leases and bank-return accounting on PostgreSQL
        run: pnpm exec vitest run tests/payout-request-database.test.ts --maxWorkers=1
        env:
          GLOHAUS_NATIVE_DATABASE: "1"

  profile-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: ./.github/actions/prepare-test-browsers
        with:
          webkit: "true"
      - name: Verify ten fictional profiles, mobile themes and non-transactional previews
        run: node scripts/check-profile-examples.mjs
      - name: Verify Owner hide, restore, persistence and save failures
        run: node scripts/check-example-visibility.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-examples-checks
          path: reports/profile-examples-*

  home-screen-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: ./.github/actions/prepare-test-browsers
        with:
          webkit: "true"
      - name: Verify populated marketplace scrolling on Android and iPhone WebKit
        run: node scripts/check-marketplace-mobile.mjs
      - name: Verify install metadata, private offline fallback and safe worker updates
        run: node scripts/check-pwa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-screen-pwa-checks
          path: |
            reports/pwa-*
            reports/marketplace-*

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:secrets
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: ./.github/actions/prepare-test-browsers
      - name: Install media test encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify desktop homepage and unchanged mobile layouts
        run: node scripts/check-desktop-home.mjs
      - name: Verify Owner account visibility and deletion controls
        run: node scripts/check-owner-account-controls.mjs
      - name: Verify direct Discover and Story photo/video uploads
        run: node scripts/check-discover-story-media.mjs
      - name: Verify shared sign-out and approved verification badges
        run: node scripts/check-signout-badges.mjs
      - name: Verify profile logos, large images, theme and actual plan prices
        run: node scripts/check-media-theme-pricing.mjs
      - name: Verify commission Centre and professional feedback
        run: node scripts/check-commission-centre.mjs
      - name: Save commission Centre browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commission-centre-checks
          path: reports/commission-*
      - run: pnpm test:e2e
      - name: Verify client blocking and customer identity journeys
        run: node scripts/check-client-blocking.mjs
      - name: Verify Owner image upload, preview, save and independent devices
        run: node scripts/check-homepage-media.mjs
      - name: Save Discover and Story media checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discover-story-media-checks
          path: |
            reports/discover-story-*.png
            reports/discover-story-media-results.json
      - name: Save sign-out and verification checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signout-badges-checks
          path: reports/signout-badges-*
      - name: Save profile and pricing visual checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-theme-pricing-checks
          path: |
            reports/media-theme-pricing-*.png
            reports/media-theme-pricing-results.json
      - name: Save homepage media visual checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-media-visual-checks
          path: |
            reports/homepage-media-*.png
            reports/homepage-media-results.json
      - name: Save desktop visual checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-home-visual-checks
          path: |
            reports/desktop-home-*.png
            reports/desktop-home-*.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/


  admin-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/prepare-test-browsers
      - name: Verify support inbox and Owner/Admin navigation
        run: node scripts/check-launch-workspace.mjs
      - name: Verify Owner future-service approvals and mobile forms
        run: node scripts/check-service-safeguards.mjs
      - name: Save support and Owner/Admin navigation checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-workspace-checks
          path: |
            reports/launch-*.png
            reports/launch-workspace-results.json
            reports/service-safeguards-*

  profile-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/prepare-test-browsers
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/check-profile-video.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-video-checks
          path: reports/profile-video-*

  professional-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/prepare-test-browsers
      - run: node scripts/check-professional-activity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: professional-activity-checks
          path: reports/activity-*

  marketing-preferences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/prepare-test-browsers
      - run: node scripts/check-marketing-preferences.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-preferences-checks
          path: reports/marketing-preferences-*

  auth-session:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/prepare-test-browsers
      - run: node scripts/check-session-consistency.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-session-checks
          path: reports/session-*

  multi-speciality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/prepare-test-browsers
      - run: node scripts/check-multi-speciality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-speciality-checks
          path: reports/taxonomy-*

  professional-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/prepare-test-browsers
      - name: Verify professional notification settings on desktop and mobile
        run: node scripts/check-professional-notifications.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: professional-notifications-checks
          path: reports/professional-notifications-*

  discovery-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/prepare-test-browsers
      - run: node scripts/check-discovery-map.mjs
      - name: Verify public-pin and nearby-search journeys
        run: node scripts/check-location-journeys.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-map-checks
          path: |
            reports/discovery-map-*
            reports/london-overview-*
            reports/location-journeys.json

  booking-payments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/prepare-test-browsers
      - name: Verify deposit, full and required payment choices in light and night mode
        run: node scripts/check-booking-payments.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-payment-checks
          path: reports/booking-payment-*

  smart-arrival:
    # Keep WebKit's system dependencies on a supported, reproducible image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/prepare-test-browsers
        timeout-minutes: 10
        with:
          webkit: "true"
      - name: Verify professional arrival tools, customer journeys and Owner communications
        run: node scripts/check-arrival.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-arrival-browser-checks
          path: reports/arrival-*

  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: node scripts/check-node-version.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:secrets
      - run: pnpm audit --prod --audit-level=low
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --maxWorkers=2
      - run: pnpm build
      - name: Verify container request origins, private uploads and callback redirects
        run: node scripts/check-proxied-origin.mjs
      - uses: ./.github/actions/prepare-test-browsers
      - name: Verify actual production-server CSP and public journeys
        run: pnpm test:e2e
        env:
          GLOHAUS_TEST_SERVER_MODE: production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: security-regression-failures
          path: test-results/

  platform-fairness:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/prepare-test-browsers
        with:
          webkit: "true"
      - name: Verify programme controls, acquisition, support and review responses on phone browsers
        run: node scripts/check-platform-fairness.mjs
      - name: Verify private privacy reviews, save failures and phone checklist on browser engines
        run: node scripts/check-privacy-operations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-fairness-browser-evidence
          path: |
            reports/*fairness*
            reports/privacy-operations-browser.json
