name: Verify foundation
on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install media test encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify direct Discover and Story photo/video uploads
        run: node scripts/check-discover-story-media.mjs
      - name: Verify shared sign-out and approved verification badges
        run: node scripts/check-signout-badges.mjs
      - name: Verify profile logos, large images, theme and actual plan prices
        run: node scripts/check-media-theme-pricing.mjs
      - name: Verify support inbox and Owner/Admin navigation
        run: node scripts/check-launch-workspace.mjs
      - name: Verify commission Centre and professional feedback
        run: node scripts/check-commission-centre.mjs
      - name: Save commission Centre browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commission-centre-checks
          path: reports/commission-*
      - run: pnpm test:e2e
      - name: Verify public-pin and nearby-search journeys
        run: node scripts/check-location-journeys.mjs
      - name: Verify client blocking and customer identity journeys
        run: node scripts/check-client-blocking.mjs
      - name: Verify desktop homepage and unchanged mobile layouts
        run: node scripts/check-desktop-home.mjs
      - name: Verify Owner image upload, preview, save and independent devices
        run: node scripts/check-homepage-media.mjs
      - name: Save Discover and Story media checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discover-story-media-checks
          path: |
            reports/discover-story-*.png
            reports/discover-story-media-results.json
      - name: Save sign-out and verification checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signout-badges-checks
          path: reports/signout-badges-*
      - name: Save profile and pricing visual checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-theme-pricing-checks
          path: |
            reports/media-theme-pricing-*.png
            reports/media-theme-pricing-results.json
      - name: Save homepage media visual checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-media-visual-checks
          path: |
            reports/homepage-media-*.png
            reports/homepage-media-results.json
      - name: Save desktop visual checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-home-visual-checks
          path: |
            reports/desktop-home-*.png
            reports/desktop-home-results.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

      - name: Save support and Owner/Admin navigation checks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-workspace-checks
          path: |
            reports/launch-*.png
            reports/launch-workspace-results.json

  profile-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/check-profile-video.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-video-checks
          path: reports/profile-video-*

  professional-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/check-professional-activity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: professional-activity-checks
          path: reports/activity-*

  marketing-preferences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/check-marketing-preferences.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-preferences-checks
          path: reports/marketing-preferences-*

  auth-session:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/check-session-consistency.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-session-checks
          path: reports/session-*
