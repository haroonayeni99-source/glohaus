name: Our Work browser check
on:
  pull_request:
    paths:
      - 'src/components/our-work.*'
      - 'src/lib/our-work-rollout.ts'
      - 'src/lib/our-work-immersive-rollout.ts'
      - 'tests/our-work-immersive-rollout.test.ts'
      - 'tests/our-work-rollout.test.ts'
      - 'src/components/social-work-player.tsx'
      - 'tests/social-work-player.test.ts'
      - 'src/components/professional-profile.tsx'
      - 'src/components/social-portfolio.tsx'
      - 'src/app/p/**'
      - 'tests/fixtures/our-work-entry.tsx'
      - 'scripts/check-our-work.mjs'
      - '.github/workflows/our-work.yml'
permissions:
  contents: read
jobs:
  our-work-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/prepare-test-browsers
      - run: command -v ffmpeg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: node scripts/check-our-work.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: our-work
          path: reports/our-work-*.png
